[project]
name = "udiagent"
version = "0.7.0"
description = "UDI Agent: LLM-powered data visualization orchestration library"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "openai>=3.33.0",
    "jsonschema>=4.26.0",
    "requests>=2.32.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
langfuse = [
    "langfuse>=4",
]
# Amazon Bedrock SigV4 auth (IAM instance profile / task role). Unpinned: the
# core openai floor already covers openai.providers.bedrock (added in 2.44.0).
# openai[bedrock] rather than a bare botocore pin tracks upstream.
bedrock = [
    "openai[bedrock]",
]
server = [
    "fastapi[standard]>=0.143.0",
    "python-jose[cryptography]>=3.5.0",
    "python-dotenv>=1.0.0",
    # Already pulled in by fastapi[standard]; declared because ServerConfig
    # imports it directly.
    "pydantic-settings>=2.0",
]
benchmark = [
    "datasets>=5.0.1",
    "huggingface-hub>=2.2.0",
    "ijson>=3.4.0.post0",
]
codegen = [
    "pandas>=2.0.0",
    "udi-grammar-py",
]
duckdb = [
    "duckdb>=1.0.0",
]
starrocks = [
    "pymysql>=1.1.0",
]
test = [
    "pytest>=8.0.0",
    "duckdb>=1.0.0",
    "cryptography>=42.0.0",
]
all = [
    "udiagent[langfuse,server,benchmark,codegen,starrocks,duckdb,bedrock]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udiagent"]

[tool.uv.sources]
udi-grammar-py = { workspace = true }
