packages:
  - packages/chat
  - packages/grammar
  - apps/grammar-app

# merged from packages/chat/pnpm-workspace.yaml
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msw: true
  vue-demi: true
minimumReleaseAgeExclude:
  - udi-toolkit

# translated from yarn `resolutions` in udi-grammar (union of app + udi-toolkit package.json)
overrides:
  flatted: 3.4.2
  node-forge: 1.4.0
  express: 4.21.2
  js-yaml: 4.1.1
  cross-spawn: 7.0.6
  glob: 10.5.0
  postcss: 8.5.15
  # scoped, not global: a global vite pin would also rewrite the vite 5 that
  # chat's vitest 2 bundles internally, breaking its test transform
  "udi-toolkit>vite": 8.1.0
  "@quasar/app-vite>vite": 8.1.0
  "anymatch>picomatch": 2.3.2
  "readdirp>picomatch": 2.3.2
  "micromatch>picomatch": 2.3.2
  "@rollup/pluginutils>picomatch": 4.0.4
  "rollup-plugin-visualizer>picomatch": 4.0.4
  "tinyglobby>picomatch": 4.0.4

# Node 24.20.0 made URL parsing spec-correct: an absolute path can no longer be
# resolved against an opaque-path base. jsonschema walks $refs with
# `new URL(ref, 'thismessage::/')`, and that base's path IS opaque, so any ref
# carrying a path part now throws — which crashes
# eslint-plugin-project-structure's config validation as its rule loads, taking
# the whole `eslint .` run down. The patch drops one colon: hash-identical
# wherever the original worked (the parsed URL is only ever read for `.hash`)
# and no longer throwing where it now does. jsonschema 1.5.0 is its latest
# release and plugin 3.14.4 still depends on ^1.5.0, so there is nothing to
# upgrade to; drop this once upstream ships a fix.
patchedDependencies:
  jsonschema@1.5.0: patches/jsonschema@1.5.0.patch
