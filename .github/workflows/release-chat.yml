name: Release udi-yac (chat)

# Tag-triggered publish. This workflow never writes to main: the "Main Branch
# Protection" ruleset requires every change to main to go through a pull
# request, so the version bump lands via PR and pushing the matching tag is
# what publishes.
#
# To release:
#   1. Bump "version" in packages/chat/package.json in a PR; merge it.
#   2. git fetch origin main
#      git tag udi-yac-v<version> origin/main && git push origin udi-yac-v<version>
#
# Release udi-toolkit FIRST whenever its version moved — udi-yac's `workspace:*`
# dep on it is rewritten to the exact in-tree toolkit version at publish time.
# The "Verify udi-toolkit dependency is published" step below enforces that.
#
# The filename is load-bearing — npm trusted publishing (OIDC) is bound to this
# repository *and* this workflow filename. Renaming it breaks publishing.

on:
  push:
    tags:
      - "udi-yac-v*"

permissions:
  contents: write # Required to create the GitHub Release
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#udi-yac-v}"
          pkg_version=$(node -p "require('./packages/chat/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/chat/package.json version ${pkg_version}"
            exit 1
          fi
          echo "Releasing udi-yac v${pkg_version}"

      - name: Verify udi-toolkit dependency is published
        run: |
          toolkit_version=$(node -p "require('./packages/grammar/package.json').version")
          if ! npm view "udi-toolkit@${toolkit_version}" version >/dev/null 2>&1; then
            echo "::error::udi-toolkit@${toolkit_version} is not on npm. Release udi-toolkit first — udi-yac's workspace:* dep is rewritten to that exact version at publish time."
            exit 1
          fi
          echo "udi-toolkit@${toolkit_version} is published"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build udi-toolkit (workspace dependency)
        run: pnpm run build:toolkit

      - name: Format check
        run: pnpm --filter udi-yac format:check

      - name: Lint
        run: pnpm --filter udi-yac lint

      - name: Typecheck
        run: pnpm --filter udi-yac typecheck

      - name: Test
        run: pnpm --filter udi-yac test

      - name: Build library
        run: pnpm --filter udi-yac build:lib

      # --no-git-checks: the tag is checked out in detached HEAD, which pnpm's
      # default branch/cleanliness checks reject.
      - name: Publish to npm
        run: pnpm --filter udi-yac publish --no-git-checks

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
