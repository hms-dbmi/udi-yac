name: Release udi-grammar-py

# Manual release: builds packages/grammar-py and publishes to PyPI.
# The published version is whatever pyproject.toml says.

on:
  workflow_dispatch:

# The build job runs the build backend, so it holds a read-only token. Only the
# publish job, which runs none of it, can publish or make the Release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build distribution
        # --out-dir: in a uv workspace, plain `uv build` writes to the workspace root dist/
        run: uv build --out-dir dist
        working-directory: packages/grammar-py

      - name: Read version
        id: version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('packages/grammar-py/pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/grammar-py/dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for making the Release
      id-token: write # Required for PyPI Trusted Publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "udi-grammar-py-v${VERSION}" --generate-notes --repo "$GITHUB_REPOSITORY"
