name: Release udi-toolkit

# Tag-triggered publish. This workflow never writes to main: the "Main Branch
# Protection" ruleset requires every change to main to go through a pull
# request, so the version bump lands via PR and pushing the matching tag is
# what publishes.
#
# To release:
#   1. Bump "version" in packages/grammar/package.json in a PR; merge it.
#   2. git fetch origin main
#      git tag udi-toolkit-v<version> origin/main && git push origin udi-toolkit-v<version>
#
# Publish udi-toolkit BEFORE releasing udi-yac when the toolkit version moved:
# udi-yac's `workspace:*` dep is rewritten to the exact in-tree toolkit version
# at publish time, so that version must already exist on npm. Let this run
# finish before pushing the udi-yac tag.
#
# The filename is load-bearing — npm trusted publishing (OIDC) is bound to this
# repository *and* this workflow filename. Renaming it breaks publishing.

on:
  push:
    tags:
      - "udi-toolkit-v*"

permissions:
  contents: write # Required to create the GitHub Release
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#udi-toolkit-v}"
          pkg_version=$(node -p "require('./packages/grammar/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/grammar/package.json version ${pkg_version}"
            exit 1
          fi
          echo "Releasing udi-toolkit v${pkg_version}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke test
        run: |
          pnpm run build:toolkit
          cd packages/grammar
          node test/smoke-vue.mjs
          node test/smoke-ce.mjs
          node test/smoke-react.mjs
          node test/smoke-exports.mjs

      # --no-git-checks: the tag is checked out in detached HEAD, which pnpm's
      # default branch/cleanliness checks reject.
      - name: Publish to npm
        run: pnpm --filter udi-toolkit publish --access public --no-git-checks

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
