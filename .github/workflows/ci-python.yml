name: CI (python)

on:
  push:
    branches: [main]
    paths:
      - "packages/agent/**"
      - "packages/grammar-py/**"
      - "pyproject.toml"
      - "uv.lock"
      - "sample-data/**"
      - "scripts/gen_datapackage.py"
      - ".github/workflows/ci-python.yml"
  # No branch filter on PRs: in a stacked PR the base is the branch below it.
  pull_request:
    paths:
      - "packages/agent/**"
      - "packages/grammar-py/**"
      - "pyproject.toml"
      - "uv.lock"
      - "sample-data/**"
      - "scripts/gen_datapackage.py"
      - ".github/workflows/ci-python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: agent
            sync-args: --extra server --extra langfuse --extra test --extra bedrock
          - package: grammar-py
            sync-args: ""
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync ${{ matrix.sync-args }}

      - name: Run tests
        run: uv run pytest tests/ -v

      # .env.template and the docs/server.md env table are generated from ServerConfig;
      # this is what stops them drifting apart again.
      - name: Check generated env docs are current
        if: matrix.package == 'agent'
        run: uv run python scripts/gen_env_docs.py --check

      # openapi.json (the docs site's HTTP API reference) is generated from the
      # FastAPI app; this fails a PR that changes the API without regenerating.
      - name: Check openapi.json is current
        if: matrix.package == 'agent'
        run: uv run --extra server python scripts/gen_openapi.py --check

      # sample-data/pcx/datapackage.json is generated from the CSVs, the data
      # dictionary and example_prompts.json; regenerate it and fail on any diff
      # (columns, types, cardinalities, foreign keys, descriptions, prompts).
      - name: Check pcx datapackage.json is current
        if: matrix.package == 'agent'
        working-directory: .
        run: |
          python3 scripts/gen_datapackage.py sample-data/pcx --strip pcx_30_ --strip _level_deid --strip _deid --parent Patient
          git diff --exit-code sample-data/pcx/datapackage.json

      - name: Verify package build
        run: uv build --out-dir dist
