name: Deploy agent to EC2

# Requires the self-hosted runner to be registered to this repo (or org-level);
# it was previously registered to hms-dbmi/UDIAgent.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      # Context is the repo root: uv.lock is the workspace lockfile (see
      # root pyproject.toml [tool.uv.workspace]), not packages/agent/uv.lock.
      - name: Build Docker image
        run: docker build -f packages/agent/Dockerfile -t udi-agent .

      # Validate before stopping the running container: a bad .env otherwise
      # costs downtime plus a `docker logs` dig, since the new container just
      # exits at import. ServerConfig reports every problem at once.
      - name: Validate env file against the config model
        run: |
          docker run --rm --env-file /home/ec2-user/.env udi-agent \
            uv run --frozen --no-sync python -c \
            "from udiagent.server.config import ServerConfig; ServerConfig()"

      - name: Restart container
        run: |
          docker stop udi-agent || true
          docker rm udi-agent || true
          docker run -d \
            --name udi-agent \
            --restart unless-stopped \
            -p 80:80 \
            --env-file /home/ec2-user/.env \
            udi-agent

      # A misconfigured .env (e.g. no JWT_SECRET_KEY) makes the container exit
      # at startup; without this the deploy would report success anyway.
      - name: Health check
        run: curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://localhost/ > /dev/null

      - name: Cleanup old images
        run: docker image prune -f
