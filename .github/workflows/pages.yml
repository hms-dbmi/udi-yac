name: Deploy to GitHub Pages

# Combined Pages site:
#   /            ← landing page + docs (apps/site, Astro Starlight)
#   /app/        ← chat SPA (packages/chat)
#   /grammar/    ← quasar demo app (apps/grammar-app)

on:
  push:
    branches: [main]
    paths:
      - "packages/chat/**"
      - "packages/grammar/**"
      - "apps/grammar-app/**"
      - "apps/site/**"
      - "sample-data/**"
      # The docs copy these in (apps/site/scripts/sync-docs.mjs)
      - "packages/agent/README.md"
      - "packages/agent/src/udiagent/query/README.md"
      - "packages/agent/src/udiagent/data/skills/template_visualizations.json"
      - "packages/grammar-py/README.md"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build udi-toolkit
        run: pnpm run build:toolkit

      - name: Build chat SPA
        run: pnpm --filter udi-yac build
        env:
          # Fixed, not repo vars: the landing page, the docs and the catalog
          # links all assume the app lives at /udi-yac/app/ and opens on pcx.
          VITE_BASE: /udi-yac/app/
          VITE_UDI_DATA_PACKAGE: /udi-yac/app/data/pcx/datapackage.json
          VITE_UDI_API_BASE_URL: ${{ vars.VITE_UDI_API_BASE_URL }}
          VITE_UDI_REMOTE_PACKAGE: ${{ vars.VITE_UDI_REMOTE_PACKAGE }}
          VITE_UDI_MODEL: ${{ vars.VITE_UDI_MODEL }}
          VITE_UDI_REQUIRE_API_KEY: ${{ vars.VITE_UDI_REQUIRE_API_KEY }}

      - name: Build grammar demo app
        run: pnpm --filter udi-grammar-app build

      - name: Build landing page + docs
        run: pnpm --filter udi-yac-site build

      - name: Assemble site
        run: |
          mkdir -p _site/app _site/grammar
          cp -r apps/site/dist/* _site/
          cp -r packages/chat/dist/* _site/app/
          cp -r apps/grammar-app/dist/spa/* _site/grammar/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
