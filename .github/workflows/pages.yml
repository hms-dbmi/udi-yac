name: Deploy to GitHub Pages

# Combined Pages site:
#   /            ← chat SPA (packages/chat)
#   /grammar/    ← quasar demo app (apps/grammar-app)

on:
  push:
    branches: [main]
    paths:
      - "packages/chat/**"
      - "packages/grammar/**"
      - "apps/grammar-app/**"
      - "pnpm-lock.yaml"
      - "scripts/gen_datapackage.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build udi-toolkit
        run: pnpm run build:toolkit

      # pcx is kept out of git (.gitignore). The public copy lives in Google
      # Drive (folder 1MPVN_fyqluIKAXdFElaGr8f2GV18og8o), which browsers cannot
      # fetch cross-origin, so mirror it into the site at build time. The chat's
      # sync-data step copies sample-data/ into the build. Update Drive files
      # via "Manage versions" so these IDs stay valid, then re-run this workflow.
      - name: Fetch pcx data package from Google Drive
        run: |
          mkdir -p sample-data/pcx
          while read -r id name; do
            curl -fsSL -o "sample-data/pcx/$name" \
              "https://drive.usercontent.google.com/download?id=$id&export=download"
          done <<'EOF'
          157k7haoaMKQNcZtT5ZswnpjNE1YjnJeW data_dictionary.csv
          1O_A8Dim4FGassYQbHRegGzdmT1jAaPDF pcx_30_demographics_deid.csv
          1Zmrq567t5HOVH8kZUNqrdFINCsOCnCUk pcx_30_event_level_deid.csv
          1WceerE5BMQV74yV8kcSpY_GWemla-Qo- pcx_30_medical_therapy_level_deid.csv
          16RoZxbNHj0Tn0mdALfWexqlEjP3PJwcK pcx_30_patient_level_deid.csv
          1bgSlCTTgkVrM4dfrjXz-iwVlXf_w5sxS pcx_30_radiation_level_deid.csv
          1FEIdgtiTDBwYC7jgEwhTuVpUlfkX3mwg pcx_30_surgery_level_deid.csv
          1uDC03yUOei0Yf5MelWXvzpRR5JVg0C5G pcx_30_treatment_summary_deid.csv
          EOF
          python3 scripts/gen_datapackage.py sample-data/pcx \
            --strip pcx_30_ --strip _level_deid --strip _deid --parent Patient

      - name: Build chat SPA
        run: pnpm --filter udi-yac build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/udi-yac/' }}
          VITE_UDI_API_BASE_URL: ${{ vars.VITE_UDI_API_BASE_URL }}
          VITE_UDI_DATA_PACKAGE: ${{ vars.VITE_UDI_DATA_PACKAGE }}
          VITE_UDI_REMOTE_PACKAGE: ${{ vars.VITE_UDI_REMOTE_PACKAGE }}
          VITE_UDI_MODEL: ${{ vars.VITE_UDI_MODEL }}
          VITE_UDI_REQUIRE_API_KEY: ${{ vars.VITE_UDI_REQUIRE_API_KEY }}

      - name: Build grammar demo app
        run: pnpm --filter udi-grammar-app build

      - name: Assemble site
        run: |
          mkdir site
          cp -r packages/chat/dist/* site/
          mkdir site/grammar
          cp -r apps/grammar-app/dist/spa/* site/grammar/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
