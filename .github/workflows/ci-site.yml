name: CI (site)

# The landing page and docs are otherwise built only by the Pages deploy on
# main. They read the chat's public API (typedoc), the READMEs and the template
# JSON, so a PR to any of those can break the docs build; keep these paths in
# step with pages.yml.

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/chat/**"
      - "packages/grammar/**"
      - "sample-data/**"
      - "packages/agent/README.md"
      - "packages/agent/src/udiagent/query/README.md"
      - "packages/agent/src/udiagent/data/skills/template_visualizations.json"
      - "packages/grammar-py/README.md"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build udi-toolkit, then the site
        run: pnpm build:site
