name: Publish udiagent to PyPI

# Fires only for releases tagged udiagent-vX.Y.Z — other packages' releases
# in this monorepo must not republish udiagent.

on:
  release:
    types: [published]

# The build job runs the build backend, so it holds a read-only token. Only the
# publish job, which runs none of it, gets the OIDC token PyPI trusts.
permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'udiagent-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # No enable-cache: setup-uv leaves the cache off on release events, so a
        # poisoned cache from a PR run can't reach a published build.
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        # --out-dir: in a uv workspace, plain `uv build` writes to the workspace root dist/
        run: uv build --out-dir dist
        working-directory: packages/agent

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/agent/dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing via OIDC

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
